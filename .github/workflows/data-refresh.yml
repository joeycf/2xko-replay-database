name: Daily data refresh

on:
  schedule:
    # 06:17 UTC daily (odd minute to dodge cron rush)
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # matches engines.node (the platform's Node policy — STACK.md §1)
          node-version: 24
          cache: npm

      - run: npm ci

      # fetch + parse (champion art is NOT part of the daily run —
      # scripts/champions.ts only runs when the roster changes)
      - name: Fetch channel uploads
        run: npm run data:fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      # THE INDEX PULL, AND IT IS ALLOWED TO FAIL.
      #
      # This is the second half of "the cron never depends on Replay Theater
      # succeeding", and it is deliberately a step of its own rather than a link
      # in `data:build`'s && chain — a chain would take the whole refresh down
      # with it, which is exactly the dependency the split exists to avoid.
      #
      # continue-on-error marks the run yellow and moves on. scripts/parse.ts
      # then finds no dump, carries the committed records, and everything else
      # about the day proceeds normally. The cost of a bad morning upstream is
      # that morning's new entries; nothing already committed is at risk, because
      # this source is add-only.
      #
      # LAST OF THE FETCHES, so a failure here cannot cost the channel dumps
      # fetched above. It reads a bounded cursor (a few pages, 10 max) rather
      # than the 71-page catalogue — see scripts/fetch-theater.ts.
      #
      # YT_API_KEY is repeated on purpose: `env:` is per step, and
      # requireApiKey() runs at module load, so without it this exits 1 before it
      # has read anything.
      - name: Fetch the tournament index (Replay Theater)
        continue-on-error: true
        run: npm run data:theater
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Parse and emit
        run: npm run data:parse

      - name: Commit if changed
        run: |
          git config user.name "2xko-data-refresh[bot]"
          git config user.email "data-refresh@users.noreply.github.com"
          # replays.json is the generic app artifact emitted alongside
          # videos.json (Phase 3) — both must land in the same commit or the
          # site's data desyncs from the pipeline substrate. summary.json is the
          # apex selector's card payload (Phase 6); it is content-derived
          # (newest replay date, not build time), so a no-new-video day leaves
          # it byte-identical and the guard below still skips the commit.
          # source-pins.json is the index source's carry pin, and patchGroups.json is
          # the UI's season->patch hierarchy. BOTH are written by the pipeline on
          # every run and NEITHER was staged, so a run that did rewrite them threw
          # the change away silently. This is Tokon's 436ae9f scar, unrepaired
          # here: "the cron only ever carries, so it only ever reads the pin — but
          # 'only ever' is what the staging list is for." scripts/refresh-all.sh
          # has warned about exactly this since it was written: the pin "MUST
          # travel with videos.json: committing a new record count while leaving
          # the pin behind makes the next carrying run — every cron run —
          # hard-fail on pin drift."
          # theater-cursor.json is where the index pull remembers how far it has
          # read. raw/ is gitignored and CI starts from a fresh checkout, so if
          # this is not committed the cursor resets to 0 every morning and every
          # run becomes a bounded sweep that never goes quiet. Content-only (one
          # integer, no timestamp) so a quiet day leaves it byte-identical.
          # theater-disagreements.json is the cross-check's output. Unlike a
          # withheld record these rows ARE published, so the file is history and
          # must travel with the videos.json it describes.
          git add data/videos.json data/replays.json data/stats.json data/players.json data/summary.json data/patchGroups.json data/source-pins.json data/theater-cursor.json data/theater-disagreements.json data/report.md
          # report.md's "_Generated <timestamp>_" line changes every run; a diff
          # that is ONLY that line is not a data change — drop it so a no-change
          # day produces no commit (and no deploy). report.md still ships
          # whenever anything real changes alongside it.
          REAL=$(git diff --cached -- data/report.md | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | { grep -vc '^[+-]_Generated ' || true; })
          if [ "$REAL" -eq 0 ]; then
            git restore --staged --worktree data/report.md
          fi
          # AND THE SAME FOR THE CURSOR, for the same reason. The catalogue takes
          # new entries every day whether or not any of OURS change, so maxEntryId
          # rises on essentially every pull and theater-cursor.json changes every
          # morning. Left staged it would retire the no-change-no-commit rule
          # outright and put a deploy on the calendar every day forever. Dropped
          # when it is the only thing left, the cursor simply does not advance on
          # a quiet day and the next run re-reads those pages; the cost is a page
          # or two, bounded at ten.
          # (Written as an emptiness test on the remaining names rather than a
          # `git diff --quiet -- <paths>`: with the cursor filtered out that path
          # list can be EMPTY, and an empty pathspec means "everything", which
          # would silently invert the check.)
          OTHERS=$(git diff --cached --name-only | grep -v '^data/theater-cursor.json$' || true)
          if [ -z "$OTHERS" ]; then
            git restore --staged --worktree data/theater-cursor.json
          fi
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          N=$(node -p "require('./data/videos.json').length")
          git commit -m "data: refresh $(date -u +%F) — ${N} videos"
          git push

      # Deploy is Vercel's git integration off the push above — there is no
      # deploy step here to run "after", so this polls until production serves
      # the count we just committed. A build still in flight is a WARNING (it
      # serves yesterday's payload, a handful of records behind); a served count
      # outside the collapse guard's own band is a FAILURE. The guard in
      # parse.ts protects the repository; this protects what visitors get.
      - name: Post-deploy smoke check
        run: npm run verify:deployed
